<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- A sign-in link must never be passed on as a referrer, or kept by a search engine. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Set your password — District Nerve Center Bajaur</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <meta name="theme-color" content="#f7f8fa" />
    <!--
      The sign-in link's page (ADR-0043, Bajaur E5). Reached from a WhatsApp button by an officer
      who has never opened the app. Opening it reads whose link it is and spends nothing; the
      form's submit uses it, sets the password and signs the officer in.
    -->
    <script>
      try {
        if (localStorage.getItem('dnc-bajaur.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
    <script>
      // Urdu, before the first paint (ADR-0042) — the same as every other page.
      try {
        if (localStorage.getItem('dnc-bajaur.lang') === 'ur') {
          var h = document.documentElement;
          h.lang = 'ur';
          h.dir = 'rtl';
          h.classList.add('i18n-pending');
          setTimeout(function () {
            h.classList.remove('i18n-pending');
          }, 4000);
        }
      } catch (e) {}
    </script>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f8fa;
        --card: #ffffff;
        --line: #d8dce4;
        --ink: #111319;
        --muted: #5f6774;
        --primary: #5b3fd6;
        --on-accent: #ffffff;
        --critical: #c11414;
        --ok: #12784a;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          'Noto Sans',
          Arial,
          sans-serif;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --paper: #08090c;
        --card: #111319;
        --line: #2a2e39;
        --ink: #f4f4f7;
        --muted: #8b8fa3;
        --primary: #9b83ff;
        --on-accent: #0b0d12;
        --critical: #f26a6a;
        --ok: #4fd18b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.5;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 32px 16px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0;
        font-size: 1.05rem;
      }
      section {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      h2 {
        margin: 0 0 6px;
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin: 14px 0 4px;
        font-weight: 600;
        font-size: 0.92rem;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      button.primary {
        width: 100%;
        margin-top: 18px;
        padding: 11px 14px;
        background: var(--primary);
        border-color: var(--primary);
        color: var(--on-accent);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .muted {
        color: var(--muted);
      }
      .error {
        color: var(--critical);
      }
      .show {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-weight: 400;
      }
      .show input {
        width: auto;
      }
      a {
        color: var(--primary);
      }
      [hidden] {
        display: none !important;
      }
      html.i18n-pending body {
        visibility: hidden;
      }
      :root[lang='ur'] body {
        font-family: 'Segoe UI', 'Noto Naskh Arabic', 'Noto Sans Arabic', Tahoma, system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>District Nerve Center · Bajaur</h1>
        <span id="langSlot"></span>
      </header>
      <section>
        <p id="status" class="muted">Loading…</p>

        <form id="form" hidden>
          <h2>Choose your password</h2>
          <p class="muted">Account: <b id="who" translate="no" dir="auto"></b></p>
          <p class="muted">
            From now on you sign in with your phone number and this password.
          </p>
          <label for="pw1">New password (at least 12 characters)</label>
          <input id="pw1" type="password" autocomplete="new-password" minlength="12" required />
          <label for="pw2">The same password again</label>
          <input id="pw2" type="password" autocomplete="new-password" minlength="12" required />
          <label class="show"><input id="showPw" type="checkbox" /> Show password</label>
          <p id="error" class="error" role="alert" hidden></p>
          <button id="save" class="primary" type="submit">Save and sign in</button>
        </form>

        <div id="done" hidden>
          <h2>Password saved</h2>
          <p class="muted">Opening the app…</p>
        </div>

        <p id="toSignIn" hidden><a href="/">Go to the sign-in page</a></p>
      </section>
    </main>
    <script src="/set-password.js"></script>
  </body>
</html>
